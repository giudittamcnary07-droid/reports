<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#00a94f">
  <title>Grab 只选目的地</title>
  <style>
    :root{--green:#00a94f;--ink:#17202a;--muted:#68737d;--line:#dfe5e8;--bg:#f2f6f4}*{box-sizing:border-box}
    body{margin:0;background:linear-gradient(180deg,#e4f7ec,#f2f6f4 300px);color:var(--ink);font:16px/1.55 system-ui,"Noto Sans SC",sans-serif}main{max-width:720px;margin:auto;padding:20px 15px 70px}
    h1{font-size:28px;margin:8px 0 4px}h2{font-size:20px;margin:0 0 12px}.lead,.hint{color:var(--muted)}.hint{font-size:13px}
    .card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:17px;margin-top:15px;box-shadow:0 8px 28px #173d2a0d}
    label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}select,input{width:100%;min-height:48px;border:1px solid #cad4d8;border-radius:12px;padding:10px 12px;background:#fff;font:inherit;color:var(--ink)}
    .destination{background:#f5faf7;border-radius:14px;padding:13px;margin:12px 0}.destination b,.destination small{display:block}.destination small{color:var(--muted);margin-top:3px}
    .buttons{display:grid;grid-template-columns:1fr 1fr;gap:9px}.btn{display:flex;align-items:center;justify-content:center;min-height:48px;border:0;border-radius:13px;padding:11px;text-decoration:none;text-align:center;font:inherit;font-weight:800}.grab{background:var(--green);color:#fff}.maps{background:#1a73e8;color:#fff}.secondary{background:#edf2f4;color:#263541}.disabled{opacity:.45;pointer-events:none}
    .add{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}.add .btn{min-height:48px}#status{min-height:22px;margin:10px 2px 0;color:#087f3b;font-size:14px;font-weight:750}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.place{border:1px solid var(--line);border-radius:15px;padding:12px;display:grid;gap:7px}.tag{font-size:12px;color:#087f3b;font-weight:800}.place b{line-height:1.3}.place small{color:var(--muted);line-height:1.35}.place .btn{min-height:40px;font-size:14px}
    .privacy{text-align:center;color:#77838d;font-size:12px;margin-top:15px}@media(max-width:600px){.buttons,.grid{grid-template-columns:1fr}.add{grid-template-columns:1fr}.add label{grid-column:1/-1}}
  </style>
</head>
<body><main>
  <h1>Grab 只选目的地</h1>
  <p class="lead">网页只交给 Grab 目的地；上车点由 Grab 应用使用自己的当前位置。</p>
  <section class="card">
    <h2>选择目的地</h2>
    <label for="to">要去哪里</label><select id="to"></select>
    <div class="destination"><b id="toName">—</b><small id="toAddress">—</small><small id="toCoord">—</small></div>
    <div class="buttons">
      <a class="btn grab" id="openGrab" href="#">打开 Grab · 使用 Grab 当前上车点</a>
      <a class="btn maps" id="openMaps" href="#">在 Google Maps 查看目的地</a>
    </div>
    <p id="status" aria-live="polite"></p>
    <p class="hint">打开后，Grab 会先显示当前接载点确认页；确认接载点后才进入车型价格页。网页不申请定位权限。</p>
  </section>
  <section class="card">
    <h2>加入 Google Maps 商店或地图针</h2>
    <div class="add"><label for="mapsInput">Google Maps 完整链接或坐标</label><input id="mapsInput" placeholder="https://www.google.com/maps/place/.../@3.14,101.71,17z"><button class="btn secondary" id="saveTo" type="button">保存为目的地</button></div>
    <p class="hint">若是 maps.app.goo.gl 短链接，先在浏览器打开，再复制地址栏中的完整链接。</p>
  </section>
  <section class="card"><h2>目的地快捷入口</h2><div class="grid" id="grid"></div></section>
  <p class="privacy">新增地点仅保存在本机浏览器；不保存当前位置、订单或付款资料。</p>
</main>
<script>
const places=[
  {id:'hotel',type:'酒店',name:'Seeds Hotel Premier Pudu TRX Kuala Lumpur',grabPoi:'Hotel Pudu Plaza',address:'2, Jalan 1/77C, off Jln Pudu, Pudu, 55100 Kuala Lumpur',lat:3.1375366,lng:101.713483},
  {id:'trx',type:'商场',name:'The Exchange TRX',address:'Persiaran TRX, Tun Razak Exchange, 55188 Kuala Lumpur',lat:3.1424073,lng:101.7168132},
  {id:'traders',type:'酒店',name:'Traders Hotel Kuala Lumpur',address:'Persiaran KLCC, Kuala Lumpur City Centre, 50088 Kuala Lumpur',lat:3.1540569,lng:101.7150575},
  {id:'klia',type:'机场',name:'Kuala Lumpur International Airport',address:'64000, KLIA, 64000 Sepang, Selangor',lat:2.7417476,lng:101.7015569},
  {id:'sentral',type:'火车站',name:'KL Sentral',address:'Kuala Lumpur Sentral, 50470 Kuala Lumpur',lat:3.13417,lng:101.68611},
  {id:'pavilion',type:'商场',name:'Pavilion Kuala Lumpur',address:'168, Jln Bukit Bintang, Bukit Bintang, 55100 Kuala Lumpur',lat:3.1491059,lng:101.7129235},
  {id:'ummc',type:'医院',name:'Universiti Malaya Medical Centre',address:'Lembah Pantai, 59100 Kuala Lumpur',lat:3.1137497,lng:101.6528165},
  {id:'petronas',type:'地标',name:'Petronas Twin Towers',address:'Kuala Lumpur City Centre, 50088 Kuala Lumpur',lat:3.1574693,lng:101.7115639},
  {id:'batu',type:'宗教景点',name:'Batu Caves',address:'Gombak, 68100 Batu Caves, Selangor',lat:3.2378844,lng:101.6840385},
  {id:'alor',type:'美食街',name:'Jalan Alor Food Street',address:'64, Jln Alor, Bukit Bintang, 50200 Kuala Lumpur',lat:3.146121,lng:101.7092762},
  {id:'embassy',type:'使馆',name:"Embassy of the People's Republic of China in Malaysia",address:'229, Jln Ampang, Taman U Thant, 50450 Kuala Lumpur',lat:3.1595511,lng:101.7278224},
  {id:'dbkl',type:'政府机构',name:'DBKL Tower 1',address:'Menara DBKL, 1, Jln Raja Laut, 50350 Kuala Lumpur',lat:3.1523673,lng:101.6939669}
];
const storageKey='maps-to-grab.customPlaces.v1',custom=new Map();let serial=0;
const valid=p=>p&&Number.isFinite(p.lat)&&Number.isFinite(p.lng)&&Math.abs(p.lat)<=90&&Math.abs(p.lng)<=180;
try{JSON.parse(localStorage.getItem(storageKey)||'[]').slice(0,50).forEach(p=>{if(p&&typeof p.id==='string'&&valid(p))custom.set(p.id,{...p,type:'自定义地点'})})}catch(_){}
const all=()=>[...places,...custom.values()],byId=id=>all().find(p=>p.id===id);
const to=document.querySelector('#to'),openGrab=document.querySelector('#openGrab'),openMaps=document.querySelector('#openMaps'),status=document.querySelector('#status');
const toName=document.querySelector('#toName'),toAddress=document.querySelector('#toAddress'),toCoord=document.querySelector('#toCoord'),mapsInput=document.querySelector('#mapsInput'),grid=document.querySelector('#grid');
function option(p){const o=document.createElement('option');o.value=p.id;o.textContent=`${p.type}｜${p.name}`;to.appendChild(o)}all().forEach(option);
const requested=new URLSearchParams(location.search).get('to');to.value=all().some(p=>p.id===requested)?requested:'hotel';
function intent(p){const q=new URLSearchParams({screenType:'BOOKING',vertical:'Car',dropOffLatitude:String(p.lat),dropOffLongitude:String(p.lng),dropOffAddress:p.address||p.name,dropOffKeywords:p.grabPoi||p.name});return `intent://open?${q.toString()}#Intent;scheme=grab;package=com.grabtaxi.passenger;end`}
function maps(p){return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${p.lat},${p.lng}`)}`}
function update(){const p=byId(to.value);if(!valid(p)){openGrab.classList.add('disabled');openMaps.classList.add('disabled');status.textContent='目的地坐标不完整。';return}toName.textContent=p.name;toAddress.textContent=p.address;toCoord.textContent=`${p.lat}, ${p.lng}`;openGrab.href=intent(p);openMaps.href=maps(p);openGrab.classList.remove('disabled');openMaps.classList.remove('disabled');status.textContent='目的地坐标已就绪；上车点将由 Grab 使用当前位置。'}
function parse(text){let d=String(text).trim();try{d=decodeURIComponent(d)}catch(_){}const patterns=[/@(-?\d{1,2}(?:\.\d+)?),(-?\d{1,3}(?:\.\d+)?)/,/!3d(-?\d{1,2}(?:\.\d+)?)[^!]*!4d(-?\d{1,3}(?:\.\d+)?)/,/(?:query|destination|origin|ll|q)=(-?\d{1,2}(?:\.\d+)?)[,%20\s]+(-?\d{1,3}(?:\.\d+)?)/,/\b(-?\d{1,2}\.\d{4,})[,\s]+(-?\d{1,3}\.\d{4,})\b/];let m;for(const re of patterns){m=d.match(re);if(m)break}if(!m)return null;const p={lat:Number(m[1]),lng:Number(m[2]),name:'Google Maps 自定义地点'};if(!valid(p))return null;const n=d.match(/\/place\/([^/@?]+)/);if(n)p.name=n[1].replace(/\+/g,' ').trim()||p.name;p.address=p.name;return p}
function appendCard(p){const c=document.createElement('article');c.className='place';const tag=document.createElement('span');tag.className='tag';tag.textContent=p.type;const b=document.createElement('b');b.textContent=p.name;const s=document.createElement('small');s.textContent=p.address;const a=document.createElement('a');a.className='btn grab';a.textContent='Grab · 以当前位置出发';a.href=intent(p);c.append(tag,b,s,a);grid.appendChild(c)}
all().forEach(appendCard);to.addEventListener('change',update);document.querySelector('#saveTo').addEventListener('click',()=>{const p=parse(mapsInput.value);if(!p){status.textContent='没有识别到坐标。请打开短链接后复制完整地址。';return}let saved=[...custom.values()].find(x=>Math.abs(x.lat-p.lat)<1e-7&&Math.abs(x.lng-p.lng)<1e-7);if(!saved){p.id=`custom-${Date.now()}-${++serial}`;p.type='自定义地点';custom.set(p.id,p);try{localStorage.setItem(storageKey,JSON.stringify([...custom.values()].slice(-50)))}catch(_){}option(p);appendCard(p);saved=p}to.value=saved.id;update()});update();
</script></body></html>
